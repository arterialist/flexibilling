name: Validate contract

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 -o yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq
      - name: Parse YAML contract files
        run: |
          yq eval '.' spec/flexibilling.yaml >/dev/null
          yq eval '.' spec/conformance.yaml >/dev/null
      - name: Validate contract against JSON Schema
        run: |
          yq eval -o=json spec/flexibilling.yaml > /tmp/flexibilling.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s schema/flexibilling.schema.json -d /tmp/flexibilling.json
      - name: Check JSON Schema syntax
        run: jq empty schema/flexibilling.schema.json
      - name: Reject implementation source files
        run: |
          if find . -type f \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.rs' -o -name '*.go' \) -not -path './.git/*' | grep -q .; then
            echo 'Implementation source files do not belong in the reference repository.'
            exit 1
          fi
